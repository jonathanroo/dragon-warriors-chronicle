name: Deploy to GitHub Pages

# Publishing is paused: the site was taken down on 29 October 2026.
# To publish again, put back the push trigger below, or run this
# workflow by hand from the Actions tab.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Serves the site from /<repo-name>/. If you use a custom domain or a
      # <username>.github.io repo, change this to: npx @11ty/eleventy
      - run: npx @11ty/eleventy --pathprefix="/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
